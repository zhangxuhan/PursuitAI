[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; MSVC's /experimental:log writes a .sarif next to every .obj. On this machine it has
; twice gone wrong on UBT's generated PerModuleInline.gen.cpp - first "Permission denied"
; on the file, then a runaway log that reached 364 GB in twelve minutes and filled the
; drive, with cl.exe at under three seconds of CPU the whole time. The file is a compiler
; diagnostic log and nothing reads it here, so it is off. Delete this only if something
; starts depending on per-object SARIF output.
bWriteSarif=False

