<svg xmlns="http://www.w3.org/2000/svg" width="960" height="530" viewBox="0 0 960 530" role="img" aria-labelledby="title desc">
  <title id="title">Pursuit policy: same-map evaluation before and after task-specific training</title>
  <desc id="desc">Moving025 catch rate rises from 55 of 100 to 100 of 100. Moving050 rises from 84 of 100 to 98 of 100 for the selected replica. These are independent deterministic evaluations, not paired episodes.</desc>
  <rect width="960" height="530" fill="#101923"/>
  <text x="48" y="55" fill="#f3f6f8" font-family="Arial, sans-serif" font-size="29" font-weight="700">Pursuit policy: before / after adaptation</text>
  <text x="48" y="84" fill="#b9c6d0" font-family="Arial, sans-serif" font-size="16">Same map within each pair · deterministic evaluation · 100 episodes per bar</text>
  <line x1="270" y1="139" x2="870" y2="139" stroke="#5b6a77"/>
  <line x1="270" y1="139" x2="270" y2="419" stroke="#5b6a77"/>
  <line x1="570" y1="139" x2="570" y2="419" stroke="#344652" stroke-dasharray="5 5"/>
  <line x1="870" y1="139" x2="870" y2="419" stroke="#5b6a77"/>
  <text x="260" y="131" text-anchor="middle" fill="#aab9c4" font-family="Arial, sans-serif" font-size="14">0%</text>
  <text x="570" y="131" text-anchor="middle" fill="#aab9c4" font-family="Arial, sans-serif" font-size="14">50%</text>
  <text x="870" y="131" text-anchor="middle" fill="#aab9c4" font-family="Arial, sans-serif" font-size="14">100%</text>

  <text x="48" y="182" fill="#f3f6f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Moving025</text>
  <text x="48" y="204" fill="#aab9c4" font-family="Arial, sans-serif" font-size="14">Target speed 0.25×</text>
  <text x="260" y="242" text-anchor="end" fill="#d5e1e8" font-family="Arial, sans-serif" font-size="16">Before</text>
  <rect x="270" y="220" width="330" height="32" rx="5" fill="#6596c4"/>
  <text x="612" y="242" fill="#f3f6f8" font-family="Arial, sans-serif" font-size="18" font-weight="700">55 / 100</text>
  <text x="260" y="292" text-anchor="end" fill="#d5e1e8" font-family="Arial, sans-serif" font-size="16">After +51.2k</text>
  <rect x="270" y="270" width="600" height="32" rx="5" fill="#65c49a"/>
  <text x="856" y="292" text-anchor="end" fill="#101923" font-family="Arial, sans-serif" font-size="18" font-weight="700">100 / 100</text>

  <line x1="48" y1="330" x2="912" y2="330" stroke="#344652"/>
  <text x="48" y="371" fill="#f3f6f8" font-family="Arial, sans-serif" font-size="20" font-weight="700">Moving050</text>
  <text x="48" y="393" fill="#aab9c4" font-family="Arial, sans-serif" font-size="14">Target speed 0.50×</text>
  <text x="260" y="369" text-anchor="end" fill="#d5e1e8" font-family="Arial, sans-serif" font-size="16">Before</text>
  <rect x="270" y="347" width="504" height="32" rx="5" fill="#6596c4"/>
  <text x="786" y="369" fill="#f3f6f8" font-family="Arial, sans-serif" font-size="18" font-weight="700">84 / 100</text>
  <text x="260" y="419" text-anchor="end" fill="#d5e1e8" font-family="Arial, sans-serif" font-size="16">Selected after</text>
  <rect x="270" y="397" width="588" height="32" rx="5" fill="#65c49a"/>
  <text x="844" y="419" text-anchor="end" fill="#101923" font-family="Arial, sans-serif" font-size="18" font-weight="700">98 / 100</text>

  <text x="48" y="468" fill="#b9c6d0" font-family="Arial, sans-serif" font-size="14">“Before” is a policy trained on the previous curriculum stage, not random weights.</text>
  <text x="48" y="491" fill="#b9c6d0" font-family="Arial, sans-serif" font-size="14">Moving050 is the best verified continuation of three highly variable runs; training was not monotonic.</text>
</svg>
